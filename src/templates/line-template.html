<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SITE_TITLE}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .article-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        .author-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .author-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #3b82f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.25rem;
        }
        
        .author-icon img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .author-name {
            font-size: 1rem;
            color: #666;
        }
        
        .content-section {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .free-content {
            font-size: 1rem;
            line-height: 1.8;
            color: #333;
            margin-bottom: 2rem;
        }
        
        .free-content p {
            margin-bottom: 1rem;
        }
        
        .free-content strong {
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .blurred-section {
            position: relative;
            padding: 2rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        
        .blurred-content {
            filter: blur(4px);
            color: #666;
            line-height: 1.8;
            user-select: none;
        }
        
        .price-note {
            text-align: center;
            color: #666;
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }
        
        .login-prompt {
            text-align: center;
            padding: 2rem;
            background-color: #e3f2fd;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        
        .login-text {
            font-size: 1.125rem;
            color: #333;
            margin-bottom: 1.5rem;
        }
        
        .login-link {
            display: inline-block;
            padding: 1rem 3rem;
            background-color: #06C755;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
        }
        
        .login-link:hover {
            background-color: #05a647;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(6, 199, 85, 0.4);
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 10px;
            }
            
            .article-title {
                font-size: 1.5rem;
            }
            
            .header, .content-section {
                padding: 1.5rem;
            }
            
            .login-link {
                padding: 0.875rem 2rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="article-title">{{SITE_TITLE}}</h1>
            <div class="author-info">
                {{AUTHOR_ICON}}
                <span class="author-name">{{AUTHOR_NAME}}</span>
            </div>
        </div>
        
        <div class="content-section">
            <div class="free-content">
                {{MAIN_CONTENT}}
            </div>
            
            <div class="blurred-section">
                <div class="blurred-content">
                    {{BLUR_CONTENT}}
                </div>
            </div>
            
            <div class="price-note">
                続きは{{CHAR_COUNT}}文字 + 画像{{IMAGE_COUNT}}枚
            </div>
            
            <div class="login-prompt">
                <p class="login-text">続きを読むにはLINE登録が必要です</p>
                <a href="{{LINE_URL}}" class="login-link">LINE友達追加して続きを読む</a>
            </div>
        </div>
    </div>
</body>
</html>
